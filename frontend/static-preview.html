<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus English Lab</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,'Microsoft YaHei',sans-serif;background:#f6f7fb;color:#172033}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#101828;color:white;padding:22px 16px}.brand{font-size:20px;font-weight:800;margin-bottom:18px}.nav-btn{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer}.nav-btn.active,.nav-btn:hover{background:#2563eb;color:white}.main{padding:24px;max-width:1200px;width:100%;margin:0 auto}.hero,.panel,.card{background:white;border:1px solid #e5e7eb;border-radius:8px;padding:18px;margin-bottom:16px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center}.hero h1,h2,h3{margin:0 0 8px}.hero p,p{line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.list{display:grid;gap:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row-between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.btn{border:0;background:#2563eb;color:white;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700}.btn.secondary{background:#eef2ff;color:#1e40af}.btn.warn{background:#dc2626}select,input,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:white;min-width:140px}textarea{width:100%;resize:vertical}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;padding:12px;border-radius:8px;margin:8px 0;cursor:pointer}.option.selected{border-color:#2563eb;background:#eff6ff}.feedback{border-left:4px solid #16a34a;background:#f0fdf4;padding:12px;border-radius:8px;margin:10px 0}.feedback.wrong{border-color:#dc2626;background:#fef2f2}.tag{display:inline-block;background:#eef2ff;color:#1e3a8a;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}.metric{background:white;border:1px solid #e5e7eb;border-radius:8px;padding:16px}.metric strong{font-size:26px;display:block}.question-block{border-top:1px solid #e5e7eb;margin-top:14px;padding-top:12px}audio{width:100%;margin:10px 0}@media(max-width:780px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2}.hero,.row-between{display:block}.main{padding:14px}}
  </style>
</head>
<body>
  <div class="app"><aside class="side"><div class="brand">Campus English Lab</div><nav id="nav"></nav></aside><main class="main" id="app"></main></div>
  <script>
    const API='/api';
    const state={tab:'home',profile:null,stats:null,wordBooks:[],wordSession:[],wordIndex:0,wordResult:null,questions:[],selectedQuestion:null,selectedAnswer:'',wrongQuestions:[],listening:[],examPapers:[],resourceIndex:[],selectedPaper:null,fullExamSession:null,fullExamReport:null,examAnswers:{},examDrafts:{},activeExamSection:'',examTimer:null,examRemaining:''};
    const tabs=[['home','首页'],['login','登录/计划'],['words','背单词'],['books','词库'],['papers','真题'],['exam','考试'],['wrong','错题本'],['listening','听力'],['stats','统计']];
    async function request(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.json()}
    const html=(s,...v)=>s.map((p,i)=>p+(v[i]??'')).join('');
    function setTab(tab){state.tab=tab;render()}
    async function init(){await loadBase();await Promise.all([loadWords(),loadQuestions(),loadWrong(),loadListening(),loadExamPapers(),loadResourceIndex()]);render()}
    async function loadBase(){state.profile=await request('/profile');state.stats=await request('/stats');state.wordBooks=await request('/wordbooks')}
    async function loadWords(){const book=inferBook(state.profile?.targetExam||'CET-6');const d=await request(`/word-review/session?wordBookId=${book}&newLimit=${state.profile?.dailyWordGoal||20}&reviewLimit=${state.profile?.dailyReviewGoal||30}`);state.wordSession=d.items||[];state.wordIndex=0;state.wordResult=null}
    async function loadQuestions(q=''){state.questions=await request('/questions'+q);state.selectedQuestion=state.questions[0]||null}
    async function loadWrong(){state.wrongQuestions=await request('/wrong-questions')}
    async function loadListening(){state.listening=await request('/listening')}
    async function loadExamPapers(q=''){state.examPapers=await request('/exam-papers'+q)}
    async function loadResourceIndex(q=''){state.resourceIndex=await request('/resource-index'+q)}
    function renderNav(){document.querySelector('#nav').innerHTML=tabs.map(([id,label])=>`<button class="nav-btn ${state.tab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('')}
    function render(){renderNav();document.querySelector('#app').innerHTML=({home:renderHome,login:renderLogin,words:renderWords,books:renderBooks,papers:renderPapers,exam:renderExam,wrong:renderWrong,listening:renderListening,stats:renderStats}[state.tab]||renderHome)()}
    const metric=(label,value)=>`<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
    function renderHome(){return html`<section class="hero"><div><h1>英语备考学习台</h1><p>围绕背词、做题、考试、错题和统计形成学习闭环。</p></div><button class="btn" onclick="setTab('exam')">进入考试</button></section><section class="grid">${metric('学习天数',state.stats.studyDays)}${metric('背词次数',state.stats.wordsReviewed)}${metric('正确率',state.stats.accuracy+'%')}${metric('待复盘错题',state.stats.activeWrongQuestions)}</section>`}
    function renderLogin(){return html`<section class="hero"><div><h1>登录/学习计划</h1><p>本地单用户模式，数据保存在本机 JSON。</p></div></section><section class="panel"><div class="toolbar"><input id="nickname" value="${state.profile.nickname}"/><select id="targetExam">${['CET-4','CET-6','KAOYAN'].map(x=>`<option ${state.profile.targetExam===x?'selected':''}>${x}</option>`).join('')}</select><input id="dailyWordGoal" type="number" value="${state.profile.dailyWordGoal}"/><input id="dailyReviewGoal" type="number" value="${state.profile.dailyReviewGoal||30}"/><button class="btn" onclick="saveProfile()">保存</button></div></section>`}
    async function saveProfile(){await request('/login',{method:'POST',body:JSON.stringify({nickname:val('nickname'),targetExam:val('targetExam')})});await request('/settings',{method:'PATCH',body:JSON.stringify({targetExam:val('targetExam'),dailyWordGoal:+val('dailyWordGoal'),dailyReviewGoal:+val('dailyReviewGoal')})});await loadBase();await loadWords();render()}
    function renderWords(){const item=state.wordSession[state.wordIndex];if(!item)return `<section class="panel"><h1>今日背词</h1><p>当前没有待学习单词。</p></section>`;const w=item.wordCard;return html`<section class="hero"><div><h1>百词斩式背词</h1><p>选择符合释义的英文词，回答后显示例句、提示并安排复习。</p></div><button class="btn secondary" onclick="loadWords().then(render)">刷新队列</button></section><section class="panel"><h2>${w.chinese}</h2><p>${w.memoryImage||''}</p>${item.options.map(o=>`<button class="option ${state.wordResult&&o.label===item.answer?'selected':''}" ${state.wordResult?'disabled':''} onclick="answerWord(${w.id},'${esc(o.label)}')">${o.label}<br><small>${o.hint||''}</small></button>`).join('')}<button class="btn warn" onclick="answerWord(${w.id},'', 'unknown')">不认识</button>${state.wordResult?`<div class="feedback ${state.wordResult.isCorrect?'':'wrong'}"><p>${state.wordResult.isCorrect?'回答正确':'需要重练'}，下次复习：${fmt(state.wordResult.nextReviewAt)}</p><p><b>${state.wordResult.answer}</b> ${w.phonetic||''}</p><p>${w.example}</p><p>${w.memoryImage||''}</p><button class="btn" onclick="nextWord()">下一词</button></div>`:''}</section>`}
    async function answerWord(id,selected,feedback){state.wordResult=await request(`/word-review/${id}/answer`,{method:'POST',body:JSON.stringify({selectedAnswer:selected,feedback})});await loadBase();render()}
    function nextWord(){state.wordIndex++;state.wordResult=null;render()}
    function renderBooks(){return html`<section class="hero"><div><h1>词库</h1><p>内置四六级与考研词库，导入接口已预留。</p></div></section><section class="list">${state.wordBooks.map(b=>`<article class="card"><h2>${b.name}</h2><p>${b.description}</p><span class="tag">${b.examType}</span><span class="tag">${b.source}</span></article>`).join('')}</section>`}
    function renderPapers(){return html`<section class="hero"><div><h1>真题训练与资源库</h1><p>基础练习题可直接作答；近十年真题/听力以资源候选链接形式接入，便于核验后导入。</p></div><button class="btn secondary" onclick="filterQuestionsAndResources()">筛选</button></section><section class="panel"><div class="toolbar"><select id="paperExam"><option value="">全部考试</option><option>CET-4</option><option>CET-6</option><option>KAOYAN</option></select><input id="paperYear" placeholder="年份，如 2024"/><select id="paperMonth"><option value="">全部月份</option><option value="6">6月</option><option value="12">12月</option></select><select id="paperType"><option value="">全部题型</option><option>reading</option><option>translation</option><option>grammar</option><option>vocabulary</option></select></div></section><section class="grid"><div class="panel"><h2>练习题</h2>${state.questions.map(q=>`<button class="option" onclick="selectQuestion(${q.id})">${q.examType} ${q.year} · ${q.type}<br>${q.prompt}</button>`).join('')||'<p>暂无练习题。</p>'}</div><div class="panel">${renderSelectedQuestion()}</div></section><section class="panel"><h2>近十年真题/听力资源候选</h2><p>共 ${state.resourceIndex.length} 条。CET 候选通常包含试题 PDF、答案 PDF、听力 MP3；考研候选链接到英语一/英语二真题检索页。</p><div class="list">${state.resourceIndex.slice(0,60).map(r=>`<article class="card"><div class="row-between"><div><h3>${r.title}</h3><p>${r.examType} · ${r.year}年${r.month||''}月 ${r.setNo?`· 第${r.setNo}套`:''}</p><p>${(r.expectedAssets||[]).join(' · ')}</p></div><a class="btn secondary" href="${r.pageUrl}" target="_blank">打开来源</a></div><span class="tag">${r.source}</span><span class="tag">${r.importStatus}</span></article>`).join('')}</div></section>`}
    async function filterQuestions(){await loadQuestions(`?examType=${val('paperExam')}&year=${val('paperYear')}&type=${val('paperType')}`);render()}async function filterQuestionsAndResources(){await loadQuestions(`?examType=${val('paperExam')}&year=${val('paperYear')}&type=${val('paperType')}`);await loadResourceIndex(`?examType=${val('paperExam')}&year=${val('paperYear')}&month=${val('paperMonth')}`);render()}function selectQuestion(id){state.selectedQuestion=state.questions.find(q=>q.id===id);state.selectedAnswer='';render()}function renderSelectedQuestion(){const q=state.selectedQuestion;if(!q)return '<p>暂无题目</p>';return `<h2>${q.type}</h2><p>${q.prompt}</p>${q.options.map(o=>`<button class="option ${state.selectedAnswer===o?'selected':''}" onclick="state.selectedAnswer='${esc(o)}';render()">${o}</button>`).join('')}<button class="btn" onclick="submitPractice()">提交</button><div id="practiceResult"></div>`}async function submitPractice(){const q=state.selectedQuestion;const r=await request(`/questions/${q.id}/attempt`,{method:'POST',body:JSON.stringify({selectedAnswer:state.selectedAnswer})});await loadWrong();document.querySelector('#practiceResult').innerHTML=`<div class="feedback ${r.isCorrect?'':'wrong'}">${r.isCorrect?'正确':'已加入错题本'}<br>${r.explanation}<br>${r.expansion}</div>`}
    function renderExam(){return html`<section class="hero"><div><h1>真实试卷考试</h1><p>分听力、阅读、翻译、写作。总倒计时，提交前不显示答案。</p></div><button class="btn secondary" onclick="filterExamPapers()">筛选试卷</button></section><section class="panel"><div class="toolbar"><select id="fullExamType"><option value="">全部考试</option><option>CET-4</option><option>CET-6</option><option>KAOYAN</option></select><input id="fullExamYear" placeholder="年份"/><select id="fullExamMonth"><option value="">全部月份</option><option value="6">6月</option><option value="12">12月</option></select></div></section>${state.fullExamSession?renderFullExamPaper():renderExamPaperList()}${state.fullExamReport?renderExamReport():''}`}
    function renderExamPaperList(){return `<section class="list">${state.examPapers.map(p=>`<article class="card"><div class="row-between"><h2>${p.title}</h2><button class="btn" onclick="startFullExam('${p.id}')">开始考试</button></div><p>${p.examType} · ${p.year}年${p.month}月 · ${p.durationMinutes}分钟 · ${p.difficulty}</p><p>${p.sectionSummary.map(s=>`${s.title} ${s.score}分/${s.questionCount}题`).join(' · ')}</p><span class="tag">${p.source?.type||'source'}</span></article>`).join('')||'<article class="card"><p>暂无匹配试卷。</p></article>'}</section>`}
    async function filterExamPapers(){await loadExamPapers(`?examType=${val('fullExamType')}&year=${val('fullExamYear')}&month=${val('fullExamMonth')}`);render()}async function startFullExam(paperId){const r=await request('/exam-sessions/full',{method:'POST',body:JSON.stringify({paperId})});state.fullExamSession=r.session;state.selectedPaper=r.paper;state.fullExamReport=null;state.examAnswers={};state.examDrafts={};state.activeExamSection=r.paper.sections[0].id;startCountdown(r.session.dueAt);render()}
    function renderFullExamPaper(){const p=state.selectedPaper;const s=p.sections.find(x=>x.id===state.activeExamSection)||p.sections[0];return `<section class="panel"><div class="row-between"><div><h2>${p.title}</h2><p>总倒计时 ${state.examRemaining||'--:--'}</p></div><div class="toolbar"><button class="btn secondary" onclick="saveExamDraft()">保存草稿</button><button class="btn" onclick="submitFullExam()">提交并批改</button></div></div><div class="toolbar">${p.sections.map(x=>`<button class="btn ${x.id===s.id?'':'secondary'}" onclick="switchSection('${x.id}')">${x.title}</button>`).join('')}</div></section><section class="panel">${renderSection(s)}</section>`}
    function renderSection(s){if(s.type==='listening')return `<h2>${s.title} · ${s.score}分</h2><audio controls ${s.audioUrl?`src="${s.audioUrl}"`:''}></audio><div class="toolbar"><button class="btn secondary" onclick="setAudioRate(.8)">0.8x</button><button class="btn secondary" onclick="setAudioRate(1)">1x</button><button class="btn secondary" onclick="setAudioRate(1.25)">1.25x</button><button class="btn secondary" onclick="setAudioRate(1.5)">1.5x</button></div><p>${s.audioNote||''}</p>${s.questions.map(q=>renderObj(s.id,'',q)).join('')}`;if(s.type==='reading')return `<h2>${s.title} · ${s.score}分</h2>${s.passages.map(p=>`<article class="card"><h3>${p.title}</h3><p>${p.text}</p>${p.questions.map(q=>renderObj(s.id,p.id,q)).join('')}</article>`).join('')}`;return `<h2>${s.title} · ${s.score}分</h2><article class="card"><p>${s.prompt}</p><textarea id="subjective-${s.id}" rows="10">${state.examDrafts[s.id]||state.examAnswers[s.id]||''}</textarea><p>主观题支持草稿保存，提交后进入待评分。</p></article>`}
    function renderObj(sid,pid,q){const k=`${sid}:${pid?pid+':':''}${q.id}`;return `<div class="question-block"><h3>${q.prompt}</h3>${q.options.map(o=>`<button class="option ${state.examAnswers[k]===o?'selected':''}" onclick="state.examAnswers['${k}']='${esc(o)}';render()">${o}</button>`).join('')}</div>`}function collectDrafts(){document.querySelectorAll("textarea[id^='subjective-']").forEach(t=>{const id=t.id.replace('subjective-','');state.examDrafts[id]=t.value;state.examAnswers[id]=t.value})}function switchSection(id){collectDrafts();state.activeExamSection=id;render()}async function saveExamDraft(){collectDrafts();state.fullExamSession=await request(`/exam-sessions/${state.fullExamSession.id}/draft`,{method:'PATCH',body:JSON.stringify({answers:state.examAnswers,drafts:state.examDrafts})});alert('草稿已保存')}async function submitFullExam(){collectDrafts();const r=await request(`/exam-sessions/${state.fullExamSession.id}/submit`,{method:'POST',body:JSON.stringify({answers:state.examAnswers,drafts:state.examDrafts})});await loadBase();await loadWrong();state.fullExamSession=null;state.selectedPaper=null;state.fullExamReport=r.report;stopCountdown();render()}function renderExamReport(){const r=state.fullExamReport;return `<section class="panel"><h2>提交报告：${r.title}</h2><p>客观题 ${r.objectiveScore} 分；主观题 ${r.pendingScore} 分待评分。</p>${r.sections.map(s=>`<article class="card"><h3>${s.title}</h3><p>客观得分：${s.objectiveScore}/${s.score} ${s.subjectiveStatus||''}</p>${s.details.map(d=>`<div class="feedback ${d.isCorrect?'':'wrong'}"><p>${d.prompt}</p><p>你的答案：${d.selectedAnswer||'未作答'}；正确答案：${d.answer}</p><p>${d.explanation}</p>${d.knowledgePoints.map(p=>`<span class="tag">${p}</span>`).join('')}</div>`).join('')}${s.subjectiveStatus?`<p>参考答案/评分要点：${s.referenceAnswer||'写作题无固定答案'}</p>`:''}</article>`).join('')}</section>`}
    function startCountdown(dueAt){stopCountdown();const end=Date.parse(dueAt);const tick=()=>{const left=Math.max(0,end-Date.now());state.examRemaining=`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;if(state.tab==='exam'&&state.fullExamSession)render();if(left<=0&&state.fullExamSession)submitFullExam()};tick();state.examTimer=setInterval(tick,1000)}function stopCountdown(){if(state.examTimer)clearInterval(state.examTimer);state.examTimer=null}
    function renderWrong(){return `<section class="hero"><div><h1>错题本</h1><p>自动记录客观题错题，可按题型和知识点复盘。</p></div><button class="btn secondary" onclick="loadWrong().then(render)">刷新</button></section><section class="list">${state.wrongQuestions.map(w=>`<article class="card"><h2>${w.question.type} · ${w.question.year}</h2><p>${w.question.prompt}</p><p>你的答案：${w.selectedAnswer||'未作答'}；正确答案：${w.question.answer}</p><p>${w.question.explanation}</p>${(w.question.knowledgePoints||[]).map(p=>`<span class="tag">${p}</span>`).join('')}</article>`).join('')||'<article class="card"><p>暂无错题。</p></article>'}</section>`}
    function renderListening(){return `<section class="hero"><div><h1>听力训练</h1><p>播放器、倍速和在线资源接口已预留。</p></div></section><section class="list">${state.listening.map(x=>`<article class="card"><h2>${x.title}</h2><p>${x.transcript}</p><audio controls loop ${x.audioUrl?`src="${x.audioUrl}"`:''}></audio><div class="toolbar"><button class="btn secondary" onclick="setAudioRate(.8)">0.8x</button><button class="btn secondary" onclick="setAudioRate(1)">1x</button><button class="btn secondary" onclick="setAudioRate(1.25)">1.25x</button></div></article>`).join('')}</section>`}function setAudioRate(r){document.querySelectorAll('audio').forEach(a=>a.playbackRate=r)}
    function renderStats(){return `<section class="hero"><div><h1>学习统计</h1><p>学习天数、背词、正确率、薄弱知识点。</p></div></section><section class="grid">${metric('学习天数',state.stats.studyDays)}${metric('背词次数',state.stats.wordsReviewed)}${metric('词汇掌握',state.stats.wordsMastered+'/'+state.stats.totalWords)}${metric('考试次数',state.stats.examSessions)}</section><section class="panel"><h2>薄弱知识点</h2>${(state.stats.weakPoints||[]).map(p=>`<span class="tag">${p.name}: ${p.count}</span>`).join('')||'<p>暂无薄弱项。</p>'}</section>`}
    function val(id){return document.querySelector('#'+id)?.value||''}function inferBook(t){return t==='CET-4'?'cet4':t==='CET-6'?'cet6':'kaoyan'}function esc(v){return String(v).replaceAll('\\','\\\\').replaceAll("'","\\'")}function fmt(v){return v?new Date(v).toLocaleString('zh-CN'):'待安排'}
    init().catch(e=>{document.querySelector('#app').innerHTML=`<section class="panel"><h1>启动失败</h1><p>${e.message}</p></section>`})
  </script>
</body>
</html>
